name: CI

# Every push / pull request runs the test suite of every project.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - "projet1 - price-tracker-pipeline"
          - "projet2 - weather-api-pipeline"
          - "projet3 - excel-automation"
          - "projet4 - sensor-analytics-duckdb"
          - "projet6 - pipeline-orchestration"
          - "projet7 - aws-serverless-data-lake"
          - "projet11 - data-quality-monitoring"
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  dbt:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "projet5 - dbt-sales-warehouse"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: dbt build --profiles-dir .
      # quality gate: the build fails if a CRITICAL data-contract check fails on the fresh warehouse
      - name: Data quality gate (Great Expectations contracts)
        working-directory: "projet11 - data-quality-monitoring"
        run: |
          pip install -r requirements.txt
          python -m src.run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-report
          path: "projet11 - data-quality-monitoring/reports/quality_report.html"

  postgres-cdc:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "projet8 - postgres-cdc-pipeline"
    env:
      PG_HOST: localhost
      PG_PORT: "5432"
      PG_USER: postgres
      PG_PASSWORD: ci-only-password
      REQUIRE_PG: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Start PostgreSQL 17 with logical decoding
        run: |
          docker run -d --name pg -p 5432:5432 -e POSTGRES_PASSWORD=$PG_PASSWORD postgres:17 -c wal_level=logical
          for i in $(seq 1 30); do docker exec pg pg_isready -U postgres && break; sleep 1; done
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q -rs

  spark-nyc-taxi:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: "projet9 - spark-nyc-taxi-lakehouse"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit tests (Spark, in-memory)
        run: python -m pytest -q
      - uses: actions/cache@v4
        with:
          path: "projet9 - spark-nyc-taxi-lakehouse/data/landing"
          key: nyc-taxi-2024-01-03
      - name: Download official NYC TLC data (3 months)
        run: python -m src.download --months 2024-01 2024-02 2024-03
      - name: Run lakehouse pipeline (bronze -> silver -> gold)
        run: python -m src.pipeline --months 2024-01 2024-02 2024-03
      - name: Publish results
        if: always()
        run: |
          cat reports/spark_report.md >> "$GITHUB_STEP_SUMMARY"
          split -l 9 reports/spark_report.md part_
          for f in part_*; do echo "::notice title=spark-report::$(sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' "$f")"; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spark-report
          path: "projet9 - spark-nyc-taxi-lakehouse/reports/"
